# EKP knowledge graph dependency rules (ADR-0004).
# Dependency targets are classified by role: foundation, practice, pattern, etc.

roles:
  foundation:
    allowed_dependencies: []

  practice:
    required_dependencies:
      - foundation
    allowed_dependencies:
      - foundation

  procedure:
    required_dependencies:
      - foundation
    allowed_dependencies:
      - foundation

  architecture:
    required_dependencies:
      - foundation
    allowed_dependencies:
      - foundation

  pattern:
    required_dependencies:
      - foundation
    allowed_dependencies:
      - foundation
      - practice

exceptions:
  - source: knowledge/engineering/design-patterns.md
    allowed_dependency: knowledge/engineering/solid.md
  # Phase 3B: integration patterns require system boundary context (EKP-LB).
  # Only cross-layer exception in this phase — pattern role otherwise allows foundation + practice only.
  - source: knowledge/architecture/integration-patterns.md
    allowed_dependency: knowledge/architecture/layering-and-boundaries.md
  # Phase 4 (V2 graph policy): framework architecture may depend on language practice.
  # No technology role yet — revisit V1 (role: technology) if exceptions proliferate.
  - source: knowledge/symfony/symfony-architecture.md
    allowed_dependency: knowledge/php/php-fundamentals.md
  # Phase 4 Wave 2: frontend architecture may depend on TypeScript language practice.
  - source: knowledge/frontend/frontend-architecture.md
    allowed_dependency: knowledge/typescript/typescript-fundamentals.md
  # NativeScript L2 architecture may depend on TypeScript language practice.
  - source: knowledge/nativescript/nativescript-architecture.md
    allowed_dependency: knowledge/typescript/typescript-fundamentals.md

depth:
  warn_at: 3
  error_at: 4
