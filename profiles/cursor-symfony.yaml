# EKP cursor-symfony profile
# Symfony architecture + PHP composed on cursor-core via includes.
# Does not modify cursor-core.yaml.

name: cursor-symfony
description: EKP Cursor bundle for Symfony application architecture (PHP + Symfony + core routing).

includes:
  - cursor-core

knowledge:
  - knowledge/php/php-fundamentals.md
  - knowledge/symfony/symfony-architecture.md

filters:
  severity:
    - required
    - recommended

adapter:
  target:
    - cursor
  include:
    adapter_priority:
      - high

outputs:
  - cursor
