# EKP cursor-devops profile
# DevOps / platform knowledge on top of the cursor-core L0 subset.
# Explicit composition — no profile extends (v0.3.1 policy).
# Does not modify cursor-core.yaml.

name: cursor-devops
description: EKP Cursor bundle for platform, CI/CD, and operational architecture.

knowledge:
  # --- Always-on: foundation + AI orchestrator (same subset as cursor-core) ---
  - knowledge/engineering/engineering-principles.md
  - knowledge/ai/ai-assisted-development.md

  # --- Routing: L0 siblings ---
  - knowledge/engineering/refactoring.md
  - knowledge/testing/testing.md
  - knowledge/engineering/error-handling.md
  - knowledge/architecture/layering-and-boundaries.md

  # --- L3: DevOps ---
  - knowledge/devops/devops-fundamentals.md

filters:
  severity:
    - required
    - recommended

adapter:
  target:
    - cursor
  include:
    adapter_priority:
      - high

outputs:
  - cursor
