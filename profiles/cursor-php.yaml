# EKP cursor-php profile
# PHP language knowledge composed on cursor-core via includes.
# Does not modify cursor-core.yaml.

name: cursor-php
description: EKP Cursor bundle for PHP language work (fundamentals + core engineering routing).

includes:
  - cursor-core

knowledge:
  - knowledge/php/php-fundamentals.md

filters:
  severity:
    - required
    - recommended

adapter:
  target:
    - cursor
  include:
    adapter_priority:
      - high

outputs:
  - cursor
