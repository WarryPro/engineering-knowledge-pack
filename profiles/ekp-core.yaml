# EKP multi-adapter pilot profile.
# Composes cursor-core knowledge without modifying cursor-core.yaml.
# Copilot, Antigravity, and Claude are AI30D pilots.

name: ekp-core
description: Pilot profile for multi-adapter assembly (Cursor, Copilot, Antigravity, and Claude).

includes:
  - cursor-core

adapter:
  include:
    adapter_priority:
      - high

outputs:
  - cursor
  - copilot
  - antigravity
  - claude
