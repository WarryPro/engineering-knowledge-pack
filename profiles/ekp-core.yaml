# EKP multi-adapter pilot profile.
# Composes cursor-core knowledge without modifying cursor-core.yaml.
# Copilot and Antigravity are declared outputs but not implemented yet;
# assemble of this profile must fail explicitly until those adapters ship.

name: ekp-core
description: Pilot profile for multi-adapter assembly (Cursor plus planned Copilot and Antigravity).

includes:
  - cursor-core

adapter:
  include:
    adapter_priority:
      - high

outputs:
  - cursor
  - copilot
  - antigravity
