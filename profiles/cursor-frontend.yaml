# EKP cursor-frontend profile
# Frontend + TypeScript composed on cursor-core via includes.
# Does not modify cursor-core.yaml.

name: cursor-frontend
description: EKP Cursor bundle for frontend application architecture (TypeScript + UI + core routing).

includes:
  - cursor-core

knowledge:
  - knowledge/typescript/typescript-fundamentals.md
  - knowledge/frontend/frontend-architecture.md
  - knowledge/frontend/frontend-styling-and-markup.md

filters:
  severity:
    - required
    - recommended

adapter:
  target:
    - cursor
  include:
    adapter_priority:
      - high

outputs:
  - cursor
