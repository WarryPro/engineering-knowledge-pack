name: EKP Validation

on:
  push:
    branches:
      - master
      - staging
  pull_request:
    branches:
      - master
      - staging

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install dependencies
        run: python -m pip install -r scripts/validate/requirements.txt

      - name: Validate knowledge
        run: python scripts/validate/validate.py

      - name: Generate indexes
        run: python scripts/validate/validate.py --generate-index

      - name: Adapter tests
        run: python -m unittest discover -s scripts/adapters/tests -v

      - name: Assemble tests
        run: python -m unittest discover -s scripts/assemble/tests -v

      - name: Assemble cursor-core bundle
        run: python scripts/assemble/assemble.py --profile cursor-core --clean --verify

      - name: Assemble cursor-php bundle
        run: python scripts/assemble/assemble.py --profile cursor-php --clean --verify

      - name: Assemble cursor-symfony bundle
        run: python scripts/assemble/assemble.py --profile cursor-symfony --clean --verify

      - name: Assemble cursor-typescript bundle
        run: python scripts/assemble/assemble.py --profile cursor-typescript --clean --verify

      - name: Assemble cursor-frontend bundle
        run: python scripts/assemble/assemble.py --profile cursor-frontend --clean --verify

      - name: Assemble cursor-devops bundle
        run: python scripts/assemble/assemble.py --profile cursor-devops --clean --verify

      - name: Assemble cursor-nativescript bundle
        run: python scripts/assemble/assemble.py --profile cursor-nativescript --clean --verify

      - name: Assemble ekp-php bundle (cursor, copilot)
        run: python scripts/assemble/assemble.py --profile ekp-php --clean --verify

      - name: Assemble ekp-typescript bundle (cursor, copilot)
        run: python scripts/assemble/assemble.py --profile ekp-typescript --clean --verify

      - name: Assemble ekp-core pilot bundle (cursor, copilot, antigravity, claude)
        run: python scripts/assemble/assemble.py --profile ekp-core --clean --verify
