# EKP Trusted Publishing pipeline (BA-B1 contract).
#
# Manual dispatch only. Unprivileged build/validation is separated from
# OIDC publication jobs. Registry / GitHub Environment setup is NOT configured
# in BA-B1 — this workflow is frozen locally for later remote validation.
#
# Trusted Publisher identity (future): workflow file path
#   .github/workflows/publish-package.yml

name: Publish Package

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Publication target registry"
        required: true
        type: choice
        options:
          - testpypi
          - pypi
      ref:
        description: "Exact source — 40-char commit SHA (testpypi) or annotated vX.Y.Z tag (pypi)"
        required: true
        type: string

jobs:
  build:
    name: Build and validate distributions
    runs-on: ubuntu-latest
    # Intentionally no id-token privilege on the build job.
    permissions:
      contents: read
    outputs:
      package_version: ${{ steps.validate.outputs.package_version }}
      resolved_sha: ${{ steps.validate.outputs.resolved_sha }}
      target: ${{ steps.validate.outputs.target }}
    steps:
      - name: Checkout repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.9"

      - name: Validate publication target and ref
        id: validate
        env:
          TARGET: ${{ inputs.target }}
          REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          python scripts/packaging/validate_release_ref.py \
            --target "${TARGET}" \
            --ref "${REF}" \
            --json

      - name: Checkout exact publication commit
        env:
          RESOLVED_SHA: ${{ steps.validate.outputs.resolved_sha }}
        run: |
          set -euo pipefail
          git checkout --detach "${RESOLVED_SHA}"
          test "$(git rev-parse HEAD)" = "${RESOLVED_SHA}"
          echo "HEAD=$(git rev-parse HEAD)"
          echo "TREE=$(git rev-parse HEAD^{tree})"
          test -z "$(git status --porcelain=v1)"

      - name: Install build and validation tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install build hatchling twine
          python -m pip install -e .

      - name: Packaging contract tests
        run: python -m unittest src.ekp.tests.test_packaging_contract -v

      - name: Prepare reproducible publication artifacts
        env:
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          set -euo pipefail
          python scripts/packaging/prepare_publish_artifacts.py \
            --repo-root "${GITHUB_WORKSPACE}" \
            --build-a "${RUNNER_TEMP}/build-a" \
            --build-b "${RUNNER_TEMP}/build-b" \
            --release-dist "${RUNNER_TEMP}/release-dist"
          ls -la "${RUNNER_TEMP}/release-dist"
          test -f "${RUNNER_TEMP}/release-dist/SHA256SUMS"
          # Exactly wheel + sdist + checksums
          test "$(find "${RUNNER_TEMP}/release-dist" -type f | wc -l)" -eq 3

      - name: Isolated historical wheel smoke
        env:
          RUNNER_TEMP: ${{ runner.temp }}
          PACKAGE_VERSION: ${{ steps.validate.outputs.package_version }}
        run: |
          set -euo pipefail
          WHEEL=$(ls "${RUNNER_TEMP}/release-dist"/engineering_knowledge_pack-*-py3-none-any.whl)
          python scripts/packaging/smoke_install_wheel.py --wheel "${WHEEL}"

      - name: Isolated workspace wheel smoke
        env:
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          set -euo pipefail
          WHEEL=$(ls "${RUNNER_TEMP}/release-dist"/engineering_knowledge_pack-*-py3-none-any.whl)
          python scripts/packaging/smoke_workspace_wheel.py --wheel "${WHEEL}"

      - name: Isolated sdist consumer smoke
        env:
          RUNNER_TEMP: ${{ runner.temp }}
          PACKAGE_VERSION: ${{ steps.validate.outputs.package_version }}
        run: |
          set -euo pipefail
          SDIST=$(ls "${RUNNER_TEMP}/release-dist"/engineering_knowledge_pack-*.tar.gz)
          python scripts/packaging/smoke_sdist_consumer.py \
            --sdist "${SDIST}" \
            --expected-version "${PACKAGE_VERSION}"

      - name: Upload publication distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ekp-publish-distributions
          path: |
            ${{ runner.temp }}/release-dist/*.whl
            ${{ runner.temp }}/release-dist/*.tar.gz
            ${{ runner.temp }}/release-dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

  publish-testpypi:
    name: Publish to TestPyPI
    needs: build
    if: ${{ inputs.target == 'testpypi' }}
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download publication distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ekp-publish-distributions
          path: ${{ runner.temp }}/publish-dist

      - name: Publish to TestPyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: ${{ runner.temp }}/publish-dist
          # skip-existing intentionally omitted — duplicates must fail closed
          verbose: true

  publish-pypi:
    name: Publish to PyPI
    needs: build
    if: ${{ inputs.target == 'pypi' }}
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download publication distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ekp-publish-distributions
          path: ${{ runner.temp }}/publish-dist

      - name: Publish to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: ${{ runner.temp }}/publish-dist
          # skip-existing intentionally omitted — duplicates must fail closed
          # Attestations: official action defaults apply (do not disable)
          verbose: true
