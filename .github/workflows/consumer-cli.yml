name: Consumer CLI Cross-Platform

on:
  push:
    branches:
      - master
      - staging
      - feature/consumer-cli
  pull_request:
    branches:
      - master
      - staging

jobs:
  consumer-cli:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.9"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: python -m pip install -r scripts/validate/requirements.txt

      - name: Install EKP package (editable)
        run: python -m pip install -e .

      - name: Consumer CLI tests
        run: python -m unittest discover -s src/ekp/tests -v

      - name: Packaging smoke test
        run: |
          python -m pip install build hatchling
          python scripts/packaging/smoke_install_wheel.py
