[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "engineering-knowledge-pack"
version = "0.17.0.dev0"
description = "Engineering Knowledge Pack — tool-agnostic engineering knowledge with AI adapters"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "EKP Contributors" }]
dependencies = [
    "PyYAML>=6.0",
    "jsonschema>=4.0",
]

[project.scripts]
ekp = "ekp.cli:main"

[project.urls]
Repository = "https://github.com/WarryPro/engineering-knowledge-pack"

[tool.hatch.build.targets.wheel]
packages = ["src/ekp"]

[tool.hatch.build.targets.wheel.force-include]
"knowledge" = "ekp/_resources/knowledge"
"profiles" = "ekp/_resources/profiles"
"schema" = "ekp/_resources/schema"
"scripts/adapters" = "ekp/_resources/scripts/adapters"
"scripts/assemble" = "ekp/_resources/scripts/assemble"
"scripts/validate" = "ekp/_resources/scripts/validate"

[tool.hatch.build.targets.sdist]
exclude = [
    "/.git",
    "/.github",
    "/build",
    "/dist",
    "/.venv",
    "/venv",
]
